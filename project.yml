name: Prompter
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
    macOS: "26.0"
  createIntermediateGroups: true
# Four configurations. Plain Debug and Release are the self-build (every feature on, no App Store purchase, no iCloud, no
# entitlements). Store Debug (the dev identity <prefix>.prompter.dev) and Store Release (the shipping app) also read the
# git-ignored Config/Store.xcconfig. See Config/Signing.xcconfig for every switch.
configs:
  Debug: debug
  Release: release
  Store Debug: debug
  Store Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"          # shared by the phone and watch apps (App Store Connect requires them to match)
    CURRENT_PROJECT_VERSION: "1"        # build number; run scripts/bump-build.sh before every TestFlight upload
    CODE_SIGN_STYLE: Automatic
  # The store switches reach every target from here (no target sets its own conditions). PROMPTER_FLAGS is empty in plain
  # Debug and Release.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(PROMPTER_FLAGS)
    Store Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(PROMPTER_FLAGS)
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(PROMPTER_FLAGS)
    Store Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(PROMPTER_FLAGS)
# DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX come from Config/Signing.xcconfig, which includes your git-ignored Config/Local.xcconfig.
# The Store configurations add the git-ignored Config/Store.xcconfig on top.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
  Store Debug: Config/StoreDebug.xcconfig
  Store Release: Config/StoreRelease.xcconfig
targets:
  Prompter:
    type: application
    platform: iOS
    sources:
      - path: Prompter
      - path: Core
      - path: Shared
    dependencies:
      - target: PrompterWatch
    info:
      path: Prompter/Info.plist
      properties:
        CFBundleDisplayName: Prompter
        # XcodeGen's default Info.plist hard-codes "1.0"/"1"; point both at the build settings so one number rules both apps.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sync uses TLS through Apple's Network framework only (no own crypto), which is exempt: see docs/testflight-checklist.md.
        ITSAppUsesNonExemptEncryption: false
        # Mac ⇄ iPhone script sync (M7): the iPhone browses Bonjour for the Mac.
        NSLocalNetworkUsageDescription: Prompter finds your Mac on this network to sync your scripts.
        NSBonjourServices:
          - _prompter-sync._tcp
        # What kind of build this is (Core/Support/BuildFlags.swift): the store switches and the iCloud container, both
        # empty in a self-build. Tests compare PrompterBuildFlags with the compiled Swift conditions.
        PrompterBuildFlags: $(PROMPTER_FLAGS)
        PrompterCloudContainer: $(PROMPTER_CLOUD_CONTAINER)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark   # the app is dark-only; without this the launch screen flashes white before the first frame
        CADisableMinimumFrameDurationOnPhone: true   # lets the prompter's display link run at 120 Hz on ProMotion iPhones
        # Voice-follow (scroll mode "Voice"): asked only when Voice is picked or a voice take opens. SpeechAnalyzer needs only
        # the microphone; the speech-recognition prompt appears only where the older on-device recogniser is the fallback.
        NSMicrophoneUsageDescription: Prompter listens to your voice so the script follows you as you speak. Audio stays on this device.
        NSSpeechRecognitionUsageDescription: Speech is recognized on this device to keep the script in step with you.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PROMPTER_APP_ID)
        CODE_SIGN_ENTITLEMENTS: $(PROMPTER_IOS_ENTITLEMENTS)   # empty (none) except in the Store configurations
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PrompterWatch:
    type: application
    platform: watchOS
    sources:
      - path: PrompterWatch
      - path: Shared
    info:
      path: PrompterWatch/Info.plist
      properties:
        CFBundleDisplayName: Prompter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PROMPTER_APP_ID)
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        # Follows the iPhone app's identity (<prefix>.prompter.dev.watchkitapp in Store Debug). No entitlements.
        PRODUCT_BUNDLE_IDENTIFIER: $(PROMPTER_APP_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PrompterMac:
    type: application
    platform: macOS
    sources:
      - path: PrompterMac
      - path: Core
      - path: Shared
    info:
      path: PrompterMac/Info.plist
      properties:
        CFBundleName: Prompter
        CFBundleDisplayName: Prompter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright 2026 Florida Focus Creation LLC
        ITSAppUsesNonExemptEncryption: false
        # Mac ⇄ iPhone script sync (M7): the Mac advertises a Bonjour service the iPhone connects to.
        NSLocalNetworkUsageDescription: Prompter finds your iPhone on this network to sync your scripts.
        NSBonjourServices:
          - _prompter-sync._tcp
        # The commit scripts/deploy-mac.sh built this copy from (empty in other builds); it tells which copies need an update.
        PrompterRevision: $(PROMPTER_REVISION)
        # As on the iPhone. Only the store flavor (team-signed, with the iCloud entitlements) can name a container.
        PrompterBuildFlags: $(PROMPTER_FLAGS)
        PrompterCloudContainer: $(PROMPTER_MAC_CLOUD_CONTAINER)
    settings:
      base:
        # The app is "Prompter.app"; the Swift module stays PrompterMac (tests: `@testable import PrompterMac`).
        PRODUCT_NAME: Prompter
        PRODUCT_MODULE_NAME: PrompterMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Bundle ID, signing, sandbox and entitlements follow the Mac flavor (PROMPTER_MAC_FLAVOR in Config/Signing.xcconfig).
        # The default, selfbuild, is signed "to run locally" (ad hoc) and not sandboxed: it builds and runs on this Mac
        # without anyone's Apple account or team. The store flavor (Store configurations) is team-signed and sandboxed.
        PRODUCT_BUNDLE_IDENTIFIER: $(PROMPTER_MAC_BUNDLE_ID)
        CODE_SIGN_IDENTITY: $(PROMPTER_MAC_SIGN_IDENTITY)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(PROMPTER_MAC_TEAM)
        ENABLE_APP_SANDBOX: $(PROMPTER_MAC_SANDBOX)
        CODE_SIGN_ENTITLEMENTS: $(PROMPTER_MAC_ENTITLEMENTS)
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Store Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
        Store Release:
          ENABLE_HARDENED_RUNTIME: YES
  PrompterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PrompterMacTests
      - path: CoreTests   # platform-neutral tests of Core/, run on both platforms
    dependencies:
      - target: PrompterMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).prompter.mac.tests
        # XcodeGen derives the host from the target name; the Mac app's product is Prompter.app.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Prompter.app/Contents/MacOS/Prompter
        # Signed the same way as its host app, so the host can load it. No entitlements of its own.
        CODE_SIGN_IDENTITY: $(PROMPTER_MAC_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(PROMPTER_MAC_TEAM)
  PrompterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrompterTests
      - path: CoreTests
    dependencies:
      - target: Prompter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).prompter.tests
schemes:
  Prompter:
    build:
      targets:
        Prompter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrompterTests
    # Xcode's Product > Archive makes a self-build. scripts/archive.sh archives Store Release itself.
    archive:
      config: Release
  PrompterWatch:
    build:
      targets:
        PrompterWatch: all
    run:
      config: Debug
  PrompterMac:
    build:
      targets:
        PrompterMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrompterMacTests
    archive:
      config: Release
